<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Owner Profile - PS Rent</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="screen-header">
            <button class="btn-back" onclick="window.location.href='home.html'">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
            </button>
            <h2 class="screen-title">Owner Profile</h2>
            <div class="header-spacer"></div>
        </header>

        <main class="screen-content with-nav">
            <div class="profile-header">
                <div class="avatar xlarge owner" style="margin: 0 auto;">
                    <span id="owner-avatar">D</span>
                </div>
                <h2 id="owner-name">Dmitry</h2>
                <div class="owner-rating" style="justify-content: center; margin-top: 8px;">
                    <svg viewBox="0 0 24 24" fill="currentColor" class="star-icon">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                    </svg>
                    <span id="owner-rating">4.9</span>
                    <span class="rating-count">(<span id="owner-reviews">124</span> reviews)</span>
                </div>
            </div>

            <div class="profile-section">
                <h3 class="section-title">Verification Status</h3>
                <div class="verification-card">
                    <div class="verification-item verified">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72"/>
                        </svg>
                        <span>Phone verified</span>
                        <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                    </div>
                    <div class="verification-item verified">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                            <line x1="16" y1="2" x2="16" y2="6"/>
                            <line x1="8" y1="2" x2="8" y2="6"/>
                            <line x1="3" y1="10" x2="21" y2="10"/>
                        </svg>
                        <span>ID verified</span>
                        <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                    </div>
                </div>
            </div>

            <div class="profile-section">
                <h3 class="section-title">My PlayStation</h3>
                <div class="console-card">
                    <div class="console-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="2" y="6" width="20" height="12" rx="2"/>
                            <circle cx="8" cy="12" r="2"/>
                            <circle cx="16" cy="12" r="2"/>
                        </svg>
                    </div>
                    <div class="console-info">
                        <h4 id="console-type">PlayStation 5</h4>
                        <p id="console-edition">Digital Edition</p>
                        <div class="console-meta">
                            <span class="badge" id="console-controllers">2 Controllers</span>
                            <span class="badge" id="console-games">10+ Games</span>
                        </div>
                    </div>
                    <button class="btn-icon" onclick="App.showToast('Edit console coming soon', 'info')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="profile-section">
                <h3 class="section-title">Pricing</h3>
                <div class="pricing-card">
                    <div class="pricing-row">
                        <span>Hourly rate</span>
                        <span class="pricing-value">800₽/hour</span>
                    </div>
                    <div class="pricing-row">
                        <span>Platform fee</span>
                        <span class="pricing-value">20%</span>
                    </div>
                    <div class="pricing-row highlight">
                        <span>Your earnings</span>
                        <span class="pricing-value">640₽/hour</span>
                    </div>
                </div>
            </div>

            <div class="profile-section">
                <button class="btn btn-secondary btn-full" onclick="switchToUser()">
                    Switch to User Mode
                </button>
                <button class="btn btn-danger-outline btn-full mt-lg" onclick="logout()">
                    Log Out
                </button>
            </div>
        </main>

        <nav class="bottom-nav">
            <a href="home.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                </svg>
                <span>Home</span>
            </a>
            <a href="map.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                    <circle cx="12" cy="10" r="3"/>
                </svg>
                <span>Map</span>
            </a>
            <a href="earnings.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="1" x2="12" y2="23"/>
                    <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                </svg>
                <span>Earnings</span>
            </a>
            <a href="profile.html" class="nav-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                <span>Profile</span>
            </a>
        </nav>
    </div>

    <script src="../js/mock-data.js"></script>
    <script src="../js/app.js"></script>
    <script>
        const state = App.getState();
        const ownerProfile = state.ownerProfile;

        // Display owner info
        document.getElementById('owner-avatar').textContent = ownerProfile.avatar;
        document.getElementById('owner-name').textContent = ownerProfile.name;
        document.getElementById('owner-rating').textContent = ownerProfile.rating;
        document.getElementById('owner-reviews').textContent = ownerProfile.reviewsCount;

        // Console info
        document.getElementById('console-type').textContent = ownerProfile.console.type;
        document.getElementById('console-edition').textContent = ownerProfile.console.edition;
        document.getElementById('console-controllers').textContent = ownerProfile.console.controllers + ' Controllers';
        document.getElementById('console-games').textContent = ownerProfile.console.games + ' Games';

        function switchToUser() {
            App.updateState({ role: 'user' });
            window.location.href = '../user/home.html';
        }

        function logout() {
            App.clearState();
            window.location.href = '../index.html';
        }
    </script>
</body>
</html>
