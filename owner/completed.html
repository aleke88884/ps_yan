<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rental Complete - PS Rent</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <main class="screen-content center">
            <div class="completed-animation">
                <div class="completed-circle earnings">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="1" x2="12" y2="23"/>
                        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                    </svg>
                </div>
            </div>

            <h2 class="completed-title">Rental Complete!</h2>
            <p class="completed-subtitle">Great job!</p>

            <div style="text-align: center; margin-bottom: 24px;">
                <span class="earnings-amount" id="earnings-amount">+1,680₽</span>
                <span class="earnings-label">Added to your balance</span>
            </div>

            <div class="completed-summary">
                <div class="summary-row">
                    <span>Duration</span>
                    <span id="summary-duration">2 hours</span>
                </div>
                <div class="summary-row">
                    <span>Customer</span>
                    <span id="summary-customer">Alex</span>
                </div>
            </div>
        </main>

        <footer class="screen-footer">
            <button class="btn btn-primary btn-full" onclick="goHome()">
                Back to Dashboard
            </button>
        </footer>
    </div>

    <script src="../js/mock-data.js"></script>
    <script src="../js/app.js"></script>
    <script>
        const state = App.getState();
        const rental = state.activeRental;

        if (rental) {
            document.getElementById('earnings-amount').textContent = '+' + App.formatPrice(rental.earnings);
            document.getElementById('summary-duration').textContent = rental.duration + ' hours';
            document.getElementById('summary-customer').textContent = rental.user.name;

            // Update owner earnings
            const ownerProfile = state.ownerProfile;
            App.updateState({
                ownerProfile: {
                    ...ownerProfile,
                    earnings: ownerProfile.earnings + rental.earnings,
                    todayEarnings: ownerProfile.todayEarnings + rental.earnings,
                    todayOrders: ownerProfile.todayOrders + 1,
                    totalOrders: ownerProfile.totalOrders + 1
                },
                activeRental: null
            });
        }

        function goHome() {
            window.location.href = 'home.html';
        }
    </script>
</body>
</html>
