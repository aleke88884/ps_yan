<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Active Rental - PS Rent</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="screen-header">
            <div class="header-spacer"></div>
            <h2 class="screen-title">Active Rental</h2>
            <button class="btn-icon" onclick="App.showToast('Help coming soon', 'info')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
                    <line x1="12" y1="17" x2="12.01" y2="17"/>
                </svg>
            </button>
        </header>

        <main class="screen-content" style="padding-bottom: 100px;">
            <div class="active-order-card">
                <div class="order-status-badge">
                    <span class="status-dot"></span>
                    <span id="status-text">Delivering</span>
                </div>

                <div class="order-timer-section">
                    <div class="timer-circle">
                        <svg viewBox="0 0 100 100">
                            <circle class="timer-bg" cx="50" cy="50" r="45"/>
                            <circle class="timer-progress" id="timer-progress" cx="50" cy="50" r="45"/>
                        </svg>
                        <div class="timer-display">
                            <span class="timer-value" id="timer-value">2:00:00</span>
                            <span class="timer-label">remaining</span>
                        </div>
                    </div>
                </div>

                <div style="margin-top: 24px;">
                    <button class="btn btn-primary btn-full" id="btn-action">
                        Mark as Delivered
                    </button>
                </div>
            </div>

            <div class="contact-card">
                <div class="contact-info-row">
                    <div class="avatar large">
                        <span id="customer-avatar">A</span>
                    </div>
                    <div class="contact-details">
                        <h3 id="customer-name">Alex</h3>
                        <p>Customer</p>
                    </div>
                </div>
                <div class="contact-actions">
                    <button class="btn btn-secondary" onclick="App.showToast('Calling customer...', 'info')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72"/>
                        </svg>
                        Call
                    </button>
                    <button class="btn btn-secondary" onclick="App.showToast('Opening chat...', 'info')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                        </svg>
                        Message
                    </button>
                </div>
            </div>

            <div class="details-card">
                <h3>Order Details</h3>
                <div class="detail-row">
                    <span class="detail-label">Console</span>
                    <span class="detail-value" id="detail-console">PlayStation 5</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Duration</span>
                    <span class="detail-value" id="detail-duration">2 hours</span>
                </div>
                <div class="detail-row total">
                    <span class="detail-label">Your earnings</span>
                    <span class="detail-value success" id="detail-earnings">1,680₽</span>
                </div>
            </div>
        </main>

        <footer class="screen-footer">
            <button class="btn btn-danger-outline btn-full" onclick="App.showToast('Report issue coming soon', 'info')">
                Report Issue
            </button>
        </footer>
    </div>

    <script src="../js/mock-data.js"></script>
    <script src="../js/app.js"></script>
    <script>
        const state = App.getState();
        const rental = state.activeRental;

        if (!rental) {
            window.location.href = 'home.html';
        }

        // Display rental info
        document.getElementById('customer-avatar').textContent = rental.user.avatar;
        document.getElementById('customer-name').textContent = rental.user.name;
        document.getElementById('detail-console').textContent = rental.consoleFull;
        document.getElementById('detail-duration').textContent = rental.duration + ' hours';
        document.getElementById('detail-earnings').textContent = App.formatPrice(rental.earnings);

        // Timer
        const totalSeconds = rental.duration * 60 * 60;
        let remainingSeconds = totalSeconds;
        const speedFactor = 120;

        const timerValue = document.getElementById('timer-value');
        const timerProgress = document.getElementById('timer-progress');
        const circumference = 2 * Math.PI * 45;
        timerProgress.style.strokeDasharray = circumference;

        const statusText = document.getElementById('status-text');
        const btnAction = document.getElementById('btn-action');
        let rentalStarted = false;

        // Action button handler
        btnAction.addEventListener('click', () => {
            if (!rentalStarted) {
                // Mark as delivered
                rentalStarted = true;
                statusText.textContent = 'In progress';
                btnAction.textContent = 'Complete Rental';
                App.showToast('Marked as delivered!', 'success');
            } else {
                // Complete rental
                clearInterval(timerInterval);
                window.location.href = 'completed.html';
            }
        });

        function updateTimer() {
            remainingSeconds -= speedFactor;

            if (remainingSeconds <= 0) {
                clearInterval(timerInterval);
                window.location.href = 'completed.html';
                return;
            }

            const hours = Math.floor(remainingSeconds / 3600);
            const minutes = Math.floor((remainingSeconds % 3600) / 60);
            const seconds = remainingSeconds % 60;
            timerValue.textContent = `${hours}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

            const progress = remainingSeconds / totalSeconds;
            const offset = circumference * (1 - progress);
            timerProgress.style.strokeDashoffset = offset;
        }

        updateTimer();
        const timerInterval = setInterval(updateTimer, 1000);
    </script>
</body>
</html>
