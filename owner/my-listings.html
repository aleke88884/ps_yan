<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Listings - PS Rent</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="screen-header">
            <div class="header-spacer"></div>
            <h2 class="screen-title">My Listings</h2>
            <button class="btn-icon" onclick="window.location.href='create-listing.html'">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"/>
                    <line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
            </button>
        </header>

        <main class="screen-content with-nav">
            <div class="my-listings" id="my-listings">
                <!-- Listings will be populated by JS -->
            </div>

            <div class="empty-listings" id="empty-listings" style="display: none;">
                <div class="empty-state">
                    <svg class="empty-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                        <line x1="12" y1="8" x2="12" y2="16"/>
                        <line x1="8" y1="12" x2="16" y2="12"/>
                    </svg>
                    <p class="empty-state-title">No listings yet</p>
                    <p class="empty-state-desc">Create your first rental listing</p>
                    <button class="btn btn-primary mt-lg" onclick="window.location.href='create-listing.html'">
                        Create Listing
                    </button>
                </div>
            </div>
        </main>

        <nav class="bottom-nav">
            <a href="home.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                </svg>
                <span>Home</span>
            </a>
            <a href="my-listings.html" class="nav-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <line x1="12" y1="8" x2="12" y2="16"/>
                    <line x1="8" y1="12" x2="16" y2="12"/>
                </svg>
                <span>Listings</span>
            </a>
            <a href="earnings.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="1" x2="12" y2="23"/>
                    <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                </svg>
                <span>Earnings</span>
            </a>
            <a href="profile.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                <span>Profile</span>
            </a>
        </nav>
    </div>

    <script src="../js/mock-data.js"></script>
    <script src="../js/app.js"></script>
    <script>
        const state = App.getState();
        const ownerProfile = state.ownerProfile;

        // Get owner's listings
        const myListings = (state.ownerListings || []);

        function renderListings() {
            const container = document.getElementById('my-listings');
            const emptyState = document.getElementById('empty-listings');

            if (myListings.length === 0) {
                container.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }

            container.style.display = 'block';
            emptyState.style.display = 'none';

            container.innerHTML = myListings.map(listing => `
                <div class="my-listing-card">
                    <div class="my-listing-image">
                        <span class="my-listing-badge">${App.getConsoleName(listing.consoleType)}</span>
                        <span class="my-listing-status ${listing.active ? 'active' : 'inactive'}">
                            ${listing.active ? 'Active' : 'Inactive'}
                        </span>
                    </div>
                    <div class="my-listing-content">
                        <h4>${listing.title}</h4>
                        <p>${listing.description}</p>
                        <div class="my-listing-footer">
                            <span class="my-listing-price">${App.formatPrice(listing.pricePerHour)}/hour</span>
                            <div class="my-listing-actions">
                                <button class="btn btn-sm btn-secondary" onclick="toggleListing(${listing.id})">
                                    ${listing.active ? 'Pause' : 'Activate'}
                                </button>
                                <button class="btn btn-sm btn-danger-outline" onclick="deleteListing(${listing.id})">
                                    Delete
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function toggleListing(listingId) {
            const listing = myListings.find(l => l.id === listingId);
            if (listing) {
                listing.active = !listing.active;
                App.updateState({ ownerListings: myListings });
                renderListings();
                App.showToast(listing.active ? 'Listing activated' : 'Listing paused', 'success');
            }
        }

        function deleteListing(listingId) {
            const index = myListings.findIndex(l => l.id === listingId);
            if (index > -1) {
                myListings.splice(index, 1);
                App.updateState({ ownerListings: myListings });
                renderListings();
                App.showToast('Listing deleted', 'info');
            }
        }

        renderListings();
    </script>
</body>
</html>
