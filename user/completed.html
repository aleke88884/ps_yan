<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rental Complete - PS Rent</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <main class="screen-content center">
            <div class="completed-animation">
                <div class="completed-circle">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                        <polyline points="22 4 12 14.01 9 11.01"/>
                    </svg>
                </div>
            </div>

            <h2 class="completed-title">Rental Complete!</h2>
            <p class="completed-subtitle">Thank you for using PS Rent</p>

            <div class="completed-summary">
                <div class="summary-row">
                    <span>Duration</span>
                    <span id="summary-duration">2 hours</span>
                </div>
                <div class="summary-row">
                    <span>Console</span>
                    <span id="summary-console">PS5</span>
                </div>
                <div class="summary-row total">
                    <span>Total paid</span>
                    <span id="summary-total">2,100₽</span>
                </div>
            </div>
        </main>

        <footer class="screen-footer">
            <button class="btn btn-primary btn-full" onclick="window.location.href='rate.html'">
                Rate Owner
            </button>
            <button class="btn btn-secondary btn-full" onclick="skipRating()">
                Back to Home
            </button>
        </footer>
    </div>

    <script src="../js/mock-data.js"></script>
    <script src="../js/app.js"></script>
    <script>
        const state = App.getState();
        const order = state.activeOrder;

        if (!order) {
            window.location.href = 'home.html';
        } else {
            document.getElementById('summary-duration').textContent = order.duration + ' hours';
            document.getElementById('summary-console').textContent = order.consoleName;
            document.getElementById('summary-total').textContent = App.formatPrice(order.total);
        }

        function skipRating() {
            App.updateState({ activeOrder: null });
            window.location.href = 'home.html';
        }
    </script>
</body>
</html>
