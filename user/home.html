<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Home - RentTech</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="screen-header home-header">
            <div class="user-greeting">
                <span class="greeting-text">Hello,</span>
                <span class="user-name" id="user-name">Alikhan</span>
            </div>
            <a href="profile.html" class="btn-icon">
                <div class="avatar">
                    <span id="user-avatar">A</span>
                </div>
            </a>
        </header>

        <main class="screen-content with-nav">
            <!-- Filter Section -->
            <div class="filter-section">
                <div class="filter-chips">
                    <button class="filter-chip active" data-filter="all">All</button>
                    <button class="filter-chip" data-filter="ps5">PS5</button>
                    <button class="filter-chip" data-filter="ps4">PS4</button>
                    <button class="filter-chip" data-filter="gaming-pc">PC</button>
                    <button class="filter-chip" data-filter="vr">VR</button>
                    <button class="filter-chip" data-filter="nintendo-switch">Switch</button>
                </div>
            </div>

            <!-- Rental Listings -->
            <div class="section-header">
                <h3>Available Near You</h3>
                <span class="listing-count" id="listing-count">8 listings</span>
            </div>

            <div class="rental-listings" id="rental-listings">
                <!-- Listings will be populated by JS -->
            </div>
        </main>

        <nav class="bottom-nav">
            <a href="home.html" class="nav-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                </svg>
                <span>Home</span>
            </a>
            <a href="orders.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>
                </svg>
                <span>Orders</span>
            </a>
            <a href="profile.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                <span>Profile</span>
            </a>
        </nav>
    </div>

    <script src="../js/mock-data.js"></script>
    <script src="../js/app.js"></script>
    <script>
        const state = App.getState();

        // Update user info
        if (state.user) {
            document.getElementById('user-name').textContent = state.user.name;
            document.getElementById('user-avatar').textContent = state.user.avatar;
        }

        // Filter chips
        const filterChips = document.querySelectorAll('.filter-chip');
        let currentFilter = 'all';

        filterChips.forEach(chip => {
            chip.addEventListener('click', () => {
                filterChips.forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                currentFilter = chip.dataset.filter;
                renderListings();
            });
        });

        // Get item icon based on type
        function getItemIcon(itemType) {
            const icons = {
                'ps5': 'PS5',
                'ps4': 'PS4',
                'ps4-pro': 'PS4',
                'gaming-pc': 'PC',
                'vr': 'VR',
                'nintendo-switch': 'NSW'
            };
            return icons[itemType] || 'TECH';
        }

        // Render rental listings
        function renderListings() {
            const listings = MockData.rentalListings || [];
            const filtered = currentFilter === 'all'
                ? listings
                : listings.filter(l => l.itemType === currentFilter);

            document.getElementById('listing-count').textContent = `${filtered.length} listings`;

            const container = document.getElementById('rental-listings');

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg class="empty-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="2" y="4" width="20" height="16" rx="2"/>
                            <path d="M6 8h.01M10 8h.01"/>
                            <path d="M6 12h12"/>
                        </svg>
                        <p class="empty-state-title">No listings found</p>
                        <p class="empty-state-desc">Try changing your filter</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(listing => `
                <div class="rental-card" onclick="viewListing(${listing.id})">
                    <div class="rental-card-image">
                        <img src="${listing.image}" alt="${listing.title}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect fill=%22%230f172a%22 width=%22100%22 height=%22100%22/><text x=%2250%22 y=%2255%22 fill=%22%230ea5e9%22 text-anchor=%22middle%22 font-size=%2220%22 font-family=%22Inter,sans-serif%22 font-weight=%22700%22>${getItemIcon(listing.itemType)}</text></svg>'">
                        <span class="rental-card-badge">${App.getItemName(listing.itemType)}</span>
                    </div>
                    <div class="rental-card-content">
                        <h4 class="rental-card-title">${listing.title}</h4>
                        <p class="rental-card-desc">${listing.description}</p>
                        <div class="rental-card-footer">
                            <div class="rental-card-owner">
                                <div class="rental-card-avatar">${listing.owner.avatar}</div>
                                <div class="rental-card-owner-info">
                                    <span class="rental-card-owner-name">${listing.owner.name}</span>
                                    <span class="rental-card-rating">
                                        <svg viewBox="0 0 24 24" fill="currentColor">
                                            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                                        </svg>
                                        ${listing.owner.rating}
                                    </span>
                                </div>
                            </div>
                            <div class="rental-card-price">
                                <span class="price-value">${App.formatPrice(listing.pricePerDay)}</span>
                                <span class="price-unit">/day</span>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function viewListing(listingId) {
            App.updateState({ currentListingId: listingId });
            window.location.href = 'listing.html';
        }

        // Initial render
        renderListings();
    </script>
</body>
</html>
