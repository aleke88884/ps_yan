<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Home - PS Rent</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="screen-header home-header">
            <div class="user-greeting">
                <span class="greeting-text">Hello,</span>
                <span class="user-name" id="user-name">Alex</span>
            </div>
            <a href="profile.html" class="btn-icon">
                <div class="avatar">
                    <span id="user-avatar">A</span>
                </div>
            </a>
        </header>

        <main class="screen-content with-nav">
            <div class="home-card">
                <h2>Rent a PlayStation</h2>
                <p>Create a rental request and get matched with nearby owners</p>

                <div class="form-section">
                    <label class="form-label">Console Type</label>
                    <div class="option-chips">
                        <button class="chip active" data-console="ps5">PS5</button>
                        <button class="chip" data-console="ps4-pro">PS4 Pro</button>
                        <button class="chip" data-console="ps4">PS4</button>
                    </div>
                </div>

                <div class="form-section">
                    <label class="form-label">Duration</label>
                    <div class="duration-selector">
                        <button class="duration-btn" id="btn-decrease">−</button>
                        <div class="duration-display">
                            <span class="duration-value" id="duration-value">2</span>
                            <span class="duration-unit">hours</span>
                        </div>
                        <button class="duration-btn" id="btn-increase">+</button>
                    </div>
                </div>

                <div class="form-section">
                    <label class="form-label">Delivery Method</label>
                    <div class="delivery-options">
                        <label class="radio-card active" data-delivery="delivery">
                            <input type="radio" name="delivery" value="delivery" checked>
                            <div class="radio-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="1" y="3" width="15" height="13"/>
                                    <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/>
                                    <circle cx="5.5" cy="18.5" r="2.5"/>
                                    <circle cx="18.5" cy="18.5" r="2.5"/>
                                </svg>
                            </div>
                            <span>Delivery</span>
                            <span class="delivery-price">+500₽</span>
                        </label>
                        <label class="radio-card" data-delivery="pickup">
                            <input type="radio" name="delivery" value="pickup">
                            <div class="radio-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                                    <circle cx="12" cy="10" r="3"/>
                                </svg>
                            </div>
                            <span>Pickup</span>
                            <span class="delivery-price">Free</span>
                        </label>
                    </div>
                </div>

                <div class="price-summary">
                    <div class="price-row">
                        <span>Rental (<span id="summary-hours">2</span>h × <span id="hourly-rate">800</span>₽)</span>
                        <span id="rental-price">1,600₽</span>
                    </div>
                    <div class="price-row" id="delivery-row">
                        <span>Delivery</span>
                        <span id="delivery-price">500₽</span>
                    </div>
                    <div class="price-row total">
                        <span>Total</span>
                        <span id="total-price">2,100₽</span>
                    </div>
                </div>
            </div>

            <!-- Recent Orders -->
            <div class="home-card" id="recent-orders-card" style="display: none;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                    <h3 style="font-size: 16px; font-weight: 600;">Recent Orders</h3>
                    <a href="orders.html" class="btn-link">View all</a>
                </div>
                <div class="order-list" id="recent-orders"></div>
            </div>
        </main>

        <footer class="screen-footer with-nav">
            <button class="btn btn-primary btn-full" id="btn-find">
                <span class="btn-text">Find PlayStation</span>
                <span class="btn-loader hidden"></span>
            </button>
        </footer>

        <nav class="bottom-nav">
            <a href="home.html" class="nav-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                </svg>
                <span>Home</span>
            </a>
            <a href="orders.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>
                </svg>
                <span>Orders</span>
            </a>
            <a href="profile.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                <span>Profile</span>
            </a>
        </nav>
    </div>

    <script src="../js/mock-data.js"></script>
    <script src="../js/app.js"></script>
    <script>
        // State
        let config = {
            console: 'ps5',
            duration: 2,
            delivery: 'delivery'
        };

        // DOM Elements
        const chips = document.querySelectorAll('.chip');
        const radioCards = document.querySelectorAll('.radio-card');
        const btnDecrease = document.getElementById('btn-decrease');
        const btnIncrease = document.getElementById('btn-increase');
        const durationValue = document.getElementById('duration-value');
        const btnFind = document.getElementById('btn-find');

        // Load saved config
        const state = App.getState();
        if (state.orderConfig) {
            config = { ...config, ...state.orderConfig };
            durationValue.textContent = config.duration;

            // Update UI to match saved config
            chips.forEach(chip => {
                chip.classList.toggle('active', chip.dataset.console === config.console);
            });
            radioCards.forEach(card => {
                card.classList.toggle('active', card.dataset.delivery === config.delivery);
            });
        }

        // Update user info
        if (state.user) {
            document.getElementById('user-name').textContent = state.user.name;
            document.getElementById('user-avatar').textContent = state.user.avatar;
        }

        // Console selection
        chips.forEach(chip => {
            chip.addEventListener('click', () => {
                chips.forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                config.console = chip.dataset.console;
                updatePricing();
            });
        });

        // Delivery selection
        radioCards.forEach(card => {
            card.addEventListener('click', () => {
                radioCards.forEach(c => c.classList.remove('active'));
                card.classList.add('active');
                config.delivery = card.dataset.delivery;
                updatePricing();
            });
        });

        // Duration controls
        btnDecrease.addEventListener('click', () => {
            if (config.duration > 1) {
                config.duration--;
                durationValue.textContent = config.duration;
                updatePricing();
            }
        });

        btnIncrease.addEventListener('click', () => {
            if (config.duration < 12) {
                config.duration++;
                durationValue.textContent = config.duration;
                updatePricing();
            }
        });

        // Update pricing display
        function updatePricing() {
            const pricing = App.calculatePrice(config.console, config.duration, config.delivery);

            document.getElementById('summary-hours').textContent = config.duration;
            document.getElementById('hourly-rate').textContent = pricing.hourlyRate.toLocaleString();
            document.getElementById('rental-price').textContent = App.formatPrice(pricing.rentalPrice);
            document.getElementById('total-price').textContent = App.formatPrice(pricing.total);

            const deliveryRow = document.getElementById('delivery-row');
            if (config.delivery === 'delivery') {
                deliveryRow.style.display = 'flex';
                document.getElementById('delivery-price').textContent = App.formatPrice(pricing.deliveryFee);
            } else {
                deliveryRow.style.display = 'none';
            }
        }

        // Find PlayStation button
        btnFind.addEventListener('click', async () => {
            App.setButtonLoading(btnFind, true);

            // Calculate pricing
            const pricing = App.calculatePrice(config.console, config.duration, config.delivery);

            // Create order object
            const order = {
                console: config.console,
                consoleName: App.getConsoleName(config.console),
                duration: config.duration,
                delivery: config.delivery,
                hourlyRate: pricing.hourlyRate,
                rentalPrice: pricing.rentalPrice,
                deliveryFee: pricing.deliveryFee,
                total: pricing.total,
                status: 'searching',
                createdAt: Date.now()
            };

            // Save to state
            App.updateState({
                orderConfig: config,
                activeOrder: order
            });

            await App.delay(500);

            // Navigate to waiting screen
            window.location.href = 'waiting.html';
        });

        // Show recent orders if any
        const recentOrders = MockData.userOrders.slice(0, 2);
        if (recentOrders.length > 0) {
            document.getElementById('recent-orders-card').style.display = 'block';
            document.getElementById('recent-orders').innerHTML = recentOrders.map(order => `
                <div class="order-item">
                    <div class="order-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="2" y="6" width="20" height="12" rx="2"/>
                            <circle cx="8" cy="12" r="2"/>
                            <circle cx="16" cy="12" r="2"/>
                        </svg>
                    </div>
                    <div class="order-info">
                        <span class="order-title">${order.console} - ${order.duration}h</span>
                        <span class="order-date">${App.formatDate(order.date)}</span>
                    </div>
                    <span class="order-amount">${App.formatPrice(order.total)}</span>
                </div>
            `).join('');
        }

        // Initialize pricing
        updatePricing();
    </script>
</body>
</html>
