<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Owner Found - PS Rent</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <main class="screen-content center">
            <div class="success-animation">
                <div class="success-circle">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                </div>
            </div>

            <h2 class="success-title">Owner Found!</h2>
            <p class="success-subtitle">Your request has been accepted</p>

            <div class="owner-preview-card">
                <div class="avatar large">
                    <span id="owner-avatar">D</span>
                </div>
                <div class="owner-info">
                    <h3 id="owner-name">Dmitry</h3>
                    <div class="owner-rating">
                        <svg viewBox="0 0 24 24" fill="currentColor" class="star-icon">
                            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                        </svg>
                        <span id="owner-rating">4.9</span>
                        <span class="rating-count">(<span id="owner-reviews">124</span> reviews)</span>
                    </div>
                </div>
            </div>
        </main>

        <footer class="screen-footer">
            <button class="btn btn-primary btn-full" onclick="window.location.href='active.html'">
                View Order Details
            </button>
        </footer>
    </div>

    <script src="../js/mock-data.js"></script>
    <script src="../js/app.js"></script>
    <script>
        // Get active order from state
        const state = App.getState();
        const order = state.activeOrder;

        if (!order || !order.owner) {
            window.location.href = 'home.html';
        } else {
            const owner = order.owner;
            document.getElementById('owner-avatar').textContent = owner.avatar;
            document.getElementById('owner-name').textContent = owner.name;
            document.getElementById('owner-rating').textContent = owner.rating;
            document.getElementById('owner-reviews').textContent = owner.reviewsCount;
        }
    </script>
</body>
</html>
