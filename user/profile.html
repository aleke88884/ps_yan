<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Profile - PS Rent</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="screen-header">
            <button class="btn-back" onclick="window.location.href='home.html'">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
            </button>
            <h2 class="screen-title">Profile</h2>
            <div class="header-spacer"></div>
        </header>

        <main class="screen-content with-nav">
            <div class="profile-header">
                <div class="avatar xlarge" style="margin: 0 auto;">
                    <span id="user-avatar">A</span>
                </div>
                <h2 id="user-name">Alex</h2>
                <p id="user-phone">+7 900 123 45 67</p>
            </div>

            <div class="profile-section">
                <h3 class="section-title">Verification</h3>
                <div class="verification-card">
                    <div class="verification-item verified">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72"/>
                        </svg>
                        <span>Phone verified</span>
                        <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                    </div>
                    <div class="verification-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                            <line x1="16" y1="2" x2="16" y2="6"/>
                            <line x1="8" y1="2" x2="8" y2="6"/>
                            <line x1="3" y1="10" x2="21" y2="10"/>
                        </svg>
                        <span>ID verification</span>
                        <button class="btn btn-sm" onclick="App.showToast('ID verification coming soon', 'info')">Verify</button>
                    </div>
                </div>
            </div>

            <div class="profile-section">
                <h3 class="section-title">Payment</h3>
                <div class="info-card" onclick="App.showToast('Payment settings coming soon', 'info')">
                    <div class="info-card-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/>
                            <line x1="1" y1="10" x2="23" y2="10"/>
                        </svg>
                    </div>
                    <div class="info-card-content">
                        <span class="info-card-label">Card</span>
                        <span class="info-card-value" id="payment-card">•••• 4242</span>
                    </div>
                    <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"/>
                    </svg>
                </div>
            </div>

            <div class="profile-section">
                <h3 class="section-title">Order History</h3>
                <div class="order-list" id="order-history"></div>
            </div>

            <div class="profile-section">
                <button class="btn btn-secondary btn-full" onclick="switchToOwner()">
                    Switch to Owner Mode
                </button>
                <button class="btn btn-danger-outline btn-full mt-lg" onclick="logout()">
                    Log Out
                </button>
            </div>
        </main>

        <nav class="bottom-nav">
            <a href="home.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                </svg>
                <span>Home</span>
            </a>
            <a href="orders.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>
                </svg>
                <span>Orders</span>
            </a>
            <a href="profile.html" class="nav-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                <span>Profile</span>
            </a>
        </nav>
    </div>

    <script src="../js/mock-data.js"></script>
    <script src="../js/app.js"></script>
    <script>
        const state = App.getState();

        // Display user info
        if (state.user) {
            document.getElementById('user-avatar').textContent = state.user.avatar;
            document.getElementById('user-name').textContent = state.user.name;
            document.getElementById('user-phone').textContent = state.user.phone;
            document.getElementById('payment-card').textContent = state.user.paymentCard;
        }

        // Display order history
        const orders = MockData.userOrders;
        const orderHistory = document.getElementById('order-history');

        if (orders.length === 0) {
            orderHistory.innerHTML = '<p class="empty-state-desc">No orders yet</p>';
        } else {
            orderHistory.innerHTML = orders.map(order => `
                <div class="order-item">
                    <div class="order-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="2" y="6" width="20" height="12" rx="2"/>
                            <circle cx="8" cy="12" r="2"/>
                            <circle cx="16" cy="12" r="2"/>
                        </svg>
                    </div>
                    <div class="order-info">
                        <span class="order-title">${order.console} - ${order.duration}h with ${order.owner.name}</span>
                        <span class="order-date">${App.formatDate(order.date)}</span>
                    </div>
                    <span class="order-amount">${App.formatPrice(order.total)}</span>
                </div>
            `).join('');
        }

        function switchToOwner() {
            App.updateState({ role: 'owner' });
            window.location.href = '../owner/home.html';
        }

        function logout() {
            App.clearState();
            window.location.href = '../index.html';
        }
    </script>
</body>
</html>
