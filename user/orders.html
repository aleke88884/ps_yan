<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Orders - PS Rent</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="screen-header">
            <div class="header-spacer"></div>
            <h2 class="screen-title">My Orders</h2>
            <div class="header-spacer"></div>
        </header>

        <main class="screen-content with-nav">
            <div class="orders-tabs">
                <button class="tab active" data-tab="active">Active</button>
                <button class="tab" data-tab="completed">Completed</button>
            </div>

            <div class="orders-list" id="orders-list"></div>
        </main>

        <nav class="bottom-nav">
            <a href="home.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                </svg>
                <span>Home</span>
            </a>
            <a href="orders.html" class="nav-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>
                </svg>
                <span>Orders</span>
            </a>
            <a href="profile.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                <span>Profile</span>
            </a>
        </nav>
    </div>

    <script src="../js/mock-data.js"></script>
    <script src="../js/app.js"></script>
    <script>
        const state = App.getState();
        const tabs = document.querySelectorAll('.tab');
        const ordersList = document.getElementById('orders-list');

        let currentTab = 'active';

        function renderOrders(tab) {
            currentTab = tab;

            // Update tabs UI
            tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === tab));

            if (tab === 'active') {
                // Check for active order
                const activeOrder = state.activeOrder;

                if (activeOrder) {
                    ordersList.innerHTML = `
                        <div class="order-item" onclick="window.location.href='active.html'">
                            <div class="order-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="2" y="6" width="20" height="12" rx="2"/>
                                    <circle cx="8" cy="12" r="2"/>
                                    <circle cx="16" cy="12" r="2"/>
                                </svg>
                            </div>
                            <div class="order-info">
                                <span class="order-title">${activeOrder.consoleName} - ${activeOrder.duration}h</span>
                                <span class="order-date" style="color: var(--warning);">In progress</span>
                            </div>
                            <span class="order-amount">${App.formatPrice(activeOrder.total)}</span>
                        </div>
                    `;
                } else {
                    ordersList.innerHTML = `
                        <div class="empty-state">
                            <svg class="empty-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                <path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>
                            </svg>
                            <h3 class="empty-state-title">No active orders</h3>
                            <p class="empty-state-desc">Create a rental request to get started</p>
                        </div>
                    `;
                }
            } else {
                // Completed orders
                const completedOrders = MockData.userOrders;

                if (completedOrders.length === 0) {
                    ordersList.innerHTML = `
                        <div class="empty-state">
                            <svg class="empty-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                <path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>
                            </svg>
                            <h3 class="empty-state-title">No completed orders</h3>
                            <p class="empty-state-desc">Your completed orders will appear here</p>
                        </div>
                    `;
                } else {
                    ordersList.innerHTML = completedOrders.map(order => `
                        <div class="order-item">
                            <div class="order-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="2" y="6" width="20" height="12" rx="2"/>
                                    <circle cx="8" cy="12" r="2"/>
                                    <circle cx="16" cy="12" r="2"/>
                                </svg>
                            </div>
                            <div class="order-info">
                                <span class="order-title">${order.console} - ${order.duration}h with ${order.owner.name}</span>
                                <span class="order-date">${App.formatDate(order.date)}</span>
                            </div>
                            <span class="order-amount">${App.formatPrice(order.total)}</span>
                        </div>
                    `).join('');
                }
            }
        }

        // Tab click handlers
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                renderOrders(tab.dataset.tab);
            });
        });

        // Initial render
        renderOrders('active');
    </script>
</body>
</html>
