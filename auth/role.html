<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Choose Role - RentTech</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container role-selection-screen">
        <header class="screen-header">
            <div class="header-spacer"></div>
            <h2 class="screen-title">Choose Role</h2>
            <div class="header-spacer"></div>
        </header>

        <main class="screen-content">
            <div class="auth-header">
                <h1>How will you use RentTech?</h1>
                <p>You can change this later in settings</p>
            </div>

            <div class="role-cards">
                <div class="role-card" id="role-user">
                    <div class="role-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </div>
                    <h3>I want to rent</h3>
                    <p>Find and rent gaming equipment from owners near you</p>
                </div>

                <div class="role-card" id="role-owner">
                    <div class="role-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="2" y="4" width="20" height="16" rx="2"/>
                            <path d="M6 8h.01M10 8h.01"/>
                            <path d="M6 12h12"/>
                        </svg>
                    </div>
                    <h3>I'm an owner</h3>
                    <p>Earn money by renting out your gaming equipment</p>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/mock-data.js"></script>
    <script src="../js/app.js"></script>
    <script>
        const roleUser = document.getElementById('role-user');
        const roleOwner = document.getElementById('role-owner');

        roleUser.addEventListener('click', () => {
            App.updateState({ role: 'user' });
            window.location.href = '../user/home.html';
        });

        roleOwner.addEventListener('click', () => {
            App.updateState({ role: 'owner' });
            window.location.href = '../owner/home.html';
        });
    </script>
</body>
</html>
