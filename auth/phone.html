<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Enter Phone - PS Rent</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="screen-header">
            <button class="btn-back" onclick="window.location.href='../index.html'">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
            </button>
            <h2 class="screen-title">Welcome</h2>
            <div class="header-spacer"></div>
        </header>

        <main class="screen-content">
            <div class="auth-header">
                <h1>Enter your phone</h1>
                <p>We'll send you a verification code</p>
            </div>

            <div class="input-group">
                <div class="phone-input">
                    <span class="country-code">+7</span>
                    <input
                        type="tel"
                        id="phone-input"
                        placeholder="900 123 45 67"
                        maxlength="13"
                        autocomplete="tel"
                    >
                </div>
            </div>
        </main>

        <footer class="screen-footer">
            <button class="btn btn-primary btn-full" id="btn-continue" disabled>
                <span class="btn-text">Continue</span>
                <span class="btn-loader hidden"></span>
            </button>
        </footer>
    </div>

    <script src="../js/mock-data.js"></script>
    <script src="../js/app.js"></script>
    <script>
        const phoneInput = document.getElementById('phone-input');
        const btnContinue = document.getElementById('btn-continue');

        // Format phone number as user types
        phoneInput.addEventListener('input', (e) => {
            const formatted = App.formatPhone(e.target.value);
            e.target.value = formatted;

            // Enable button if 10 digits entered
            const digits = formatted.replace(/\D/g, '');
            btnContinue.disabled = digits.length < 10;
        });

        // Handle continue button
        btnContinue.addEventListener('click', async () => {
            const phone = '+7 ' + phoneInput.value;

            // Show loading
            App.setButtonLoading(btnContinue, true);

            // Save phone to state
            App.updateState({ phoneNumber: phone });

            // Simulate API delay
            await App.delay(1000);

            // Navigate to OTP screen
            window.location.href = 'otp.html';
        });

        // Focus input on load
        phoneInput.focus();
    </script>
</body>
</html>
