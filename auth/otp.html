<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Verify Code - PS Rent</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="screen-header">
            <button class="btn-back" onclick="window.location.href='phone.html'">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
            </button>
            <h2 class="screen-title">Verification</h2>
            <div class="header-spacer"></div>
        </header>

        <main class="screen-content">
            <div class="auth-header">
                <h1>Enter code</h1>
                <p>Sent to <span id="phone-display">+7 900 123 45 67</span></p>
            </div>

            <div class="otp-inputs">
                <input type="text" inputmode="numeric" maxlength="1" class="otp-input" data-index="0">
                <input type="text" inputmode="numeric" maxlength="1" class="otp-input" data-index="1">
                <input type="text" inputmode="numeric" maxlength="1" class="otp-input" data-index="2">
                <input type="text" inputmode="numeric" maxlength="1" class="otp-input" data-index="3">
            </div>

            <button class="btn-link resend-btn" id="resend-btn" disabled>
                Resend code <span id="resend-timer">(30s)</span>
            </button>
        </main>

        <footer class="screen-footer">
            <button class="btn btn-primary btn-full" id="btn-verify" disabled>
                <span class="btn-text">Verify</span>
                <span class="btn-loader hidden"></span>
            </button>
        </footer>
    </div>

    <script src="../js/mock-data.js"></script>
    <script src="../js/app.js"></script>
    <script>
        const otpInputs = document.querySelectorAll('.otp-input');
        const btnVerify = document.getElementById('btn-verify');
        const resendBtn = document.getElementById('resend-btn');
        const resendTimer = document.getElementById('resend-timer');
        const phoneDisplay = document.getElementById('phone-display');

        // Show phone number from state
        const state = App.getState();
        if (state.phoneNumber) {
            phoneDisplay.textContent = state.phoneNumber;
        }

        // Handle OTP input
        otpInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                // Only allow digits
                e.target.value = e.target.value.replace(/\D/g, '');

                if (e.target.value) {
                    e.target.classList.add('filled');
                    // Move to next input
                    if (index < otpInputs.length - 1) {
                        otpInputs[index + 1].focus();
                    }
                } else {
                    e.target.classList.remove('filled');
                }

                // Check if all filled
                checkOtpComplete();
            });

            input.addEventListener('keydown', (e) => {
                // Handle backspace
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    otpInputs[index - 1].focus();
                    otpInputs[index - 1].value = '';
                    otpInputs[index - 1].classList.remove('filled');
                }
            });

            // Handle paste
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const paste = e.clipboardData.getData('text').replace(/\D/g, '');
                paste.split('').slice(0, 4).forEach((char, i) => {
                    if (otpInputs[i]) {
                        otpInputs[i].value = char;
                        otpInputs[i].classList.add('filled');
                    }
                });
                checkOtpComplete();
            });
        });

        function checkOtpComplete() {
            const allFilled = Array.from(otpInputs).every(input => input.value.length === 1);
            btnVerify.disabled = !allFilled;
        }

        // Handle verify button
        btnVerify.addEventListener('click', async () => {
            App.setButtonLoading(btnVerify, true);

            // Simulate verification
            await App.delay(1500);

            // Mark as authenticated
            App.updateState({ isAuthenticated: true });

            // Navigate to role selection
            window.location.href = 'role.html';
        });

        // Resend timer
        let seconds = 30;
        const timerInterval = setInterval(() => {
            seconds--;
            resendTimer.textContent = `(${seconds}s)`;

            if (seconds <= 0) {
                clearInterval(timerInterval);
                resendTimer.textContent = '';
                resendBtn.disabled = false;
            }
        }, 1000);

        // Resend button
        resendBtn.addEventListener('click', () => {
            App.showToast('Code sent!', 'success');
            resendBtn.disabled = true;
            seconds = 30;
            resendTimer.textContent = '(30s)';

            const newInterval = setInterval(() => {
                seconds--;
                resendTimer.textContent = `(${seconds}s)`;
                if (seconds <= 0) {
                    clearInterval(newInterval);
                    resendTimer.textContent = '';
                    resendBtn.disabled = false;
                }
            }, 1000);
        });

        // Focus first input
        otpInputs[0].focus();
    </script>
</body>
</html>
